name: Deploy to GitHub Pages

# Publica a landing sempre que houver push na main (ou disparo manual).
on:
  push:
    branches: ['main']
  workflow_dispatch:

# Permissões mínimas exigidas pelo deploy oficial de Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Garante que só um deploy de Pages roda por vez (sem cancelar o que está em produção).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Build (Vite)
        run: pnpm build

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Publicar a build (dist) como artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy para o GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
